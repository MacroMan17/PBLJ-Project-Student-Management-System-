spring:
  application:
    name: Student Management System

  datasource:
    url: jdbc:mysql://localhost:3306/student_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.studentmgmt: DEBUG
